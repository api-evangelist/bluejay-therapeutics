aid: bluejay-therapeutics
name: Bluejay Therapeutics
image: https://bluejaytx.com/wp-content/uploads/2023/01/BluejayTx_Logo.png
description: >-
  Bluejay Therapeutics, Inc. was a clinical-stage biopharmaceutical company headquartered in Redwood
  City, California, developing treatments for viral hepatitis and liver disease. Its lead asset,
  brelovitug (BJT-778), is an investigational monoclonal antibody targeting the surface antigen
  shared by the hepatitis D and hepatitis B viruses; it received U.S. FDA Breakthrough Therapy
  designation for chronic hepatitis delta and reported a 100% virologic response at week 48 in its
  Phase 2 monotherapy study before entering the AZURE-2 global Phase 3 trial. The company also
  advanced a proprietary TLR9 agonist (cavrotolimod), a liver-targeted HBV transcript inhibitor
  (BJT-628) and a liver-targeted fatty acid synthase inhibitor (BJT-188) toward a combination
  regimen aimed at functional cure of chronic hepatitis B. Mirum Pharmaceuticals agreed to acquire
  Bluejay Therapeutics in December 2025 and completed the acquisition on 26 January 2026; the
  corporate site now serves a single acquisition notice redirecting readers to mirumpharma.com.
  Bluejay Therapeutics never ran a developer program — no product API, no developer portal, no API
  documentation, no SDKs, no GitHub organisation and no package-registry presence. The only
  machine-readable surface reachable without credentials is the WordPress REST content API behind
  bluejaytx.com, catalogued here. That surface is notable for outliving the web site it belongs to:
  the marketing page tree was deleted in the teardown, but the REST API and the post archive still
  serve all 35 press releases and publication notices from 2021 through 2025 with full text.
