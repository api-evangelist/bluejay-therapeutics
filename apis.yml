  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://bluejaytx.com/wp-json/ — 372 routes across the 17 namespaces oembed/1.0,
    wpe/cache-plugin/v1, wpe_sign_on_plugin/v1, aioseo/v1, code-snippets/v1, contact-form-7/v1,
    jupiterx-license, elementor/v1, monsterinsights/v1, elementor/v1/documents, elementor-ai/v1,
    elementor-pro/v1, omapp/v1, wp/v2, wp-site-health/v1, wp-block-editor/v1 and wp-abilities/v1 —
    and verified against live anonymous responses on 2026-08-07. Only the 26 operations that were
    individually called and returned data without credentials are modelled. The site registers the
    WordPress Abilities API (`wp-abilities/v1`), an agent-facing capability registry, but every
    endpoint under it returns 401 rest_forbidden anonymously, so no agent surface is claimed here.
    /wp/v2/settings, /wp/v2/themes, /wp/v2/plugins, /wp/v2/menus, /wp/v2/menu-locations,
    /wp/v2/widgets, /wp/v2/block-types, /wp/v2/templates, /wp/v2/font-collections, /wp/v2/icons,
    /oembed/1.0/proxy, all aioseo/v1, elementor/v1 and wp-site-health/v1 routes return 401, and
    /contact-form-7/v1/contact-forms returns 403 wpcf7_forbidden. /wp/v2/users returns 200
    anonymously with five named individuals and is DELIBERATELY NOT MODELLED under the enrichment
    PII guardrail — the exposure is documented in conventions/, but no operation, agent skill or
    MCP tool is emitted for it. Bluejay Therapeutics publishes no developer documentation, no API
    reference, no getting-started guide and no support channel for this surface, so no
    Documentation/APIReference/GettingStarted pointers are emitted; the humanURL above is the
    upstream WordPress REST handbook that defines the wp/v2 contract.
