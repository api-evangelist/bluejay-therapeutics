apis:
- aid: bluejay-therapeutics:bluejay-therapeutics-content-api
  name: Bluejay Therapeutics Content API
  description: >-
    The anonymously readable WordPress REST API behind bluejaytx.com. It exposes the 35 published
    press releases and publication notices spanning 2021-08-12 to 2025-12-08 with full
    `content.rendered` bodies, the 99-item media library of press-release PDFs and poster decks,
    the four content categories (Press Release 26, Publication 8, Presentation 0, Uncategorized 1),
    the single tag, the registered post types, taxonomies and statuses, cross-content search, and
    the oEmbed 1.0 provider endpoint. The one thing a consumer must know is that this API now
    carries more of the company's record than its web site does: after the Mirum Pharmaceuticals
    acquisition completed on 26 January 2026 the page tree was collapsed to a single page (id 606,
    served at the root) holding a two-sentence acquisition notice, and /about/, /science/,
    /pipeline/, /news/, /contact/ and /privacy-policy/ all return 404 — while every press release
    remains fully readable over REST, at its original permalink, and through the category archive.
    This is not a developer product Bluejay Therapeutics marketed; it is the site's own content
    surface, registered at /wp-json/ and verified against live anonymous responses on 2026-08-07.
    The OpenAPI in this repo is derived from the published route index.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://bluejaytx.com/wp-json
